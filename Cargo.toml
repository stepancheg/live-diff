[package]
name = "sl-tui"
version = "0.1.0"
edition = "2024"
description = "Terminal UI for Sapling: smartlog, live diff, and commit or PR view"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
compact_str = "0.10.0"
crossterm = "0.29.0"
derive_more = { version = "2.1", features = ["display", "add", "add_assign", "sum"] }
libc = "0.2.191"
ref-cast = "1.0.27"
regex = "1.12.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
terminal-colorsaurus = "1.0.3"
tokio = { version = "1.54.1", features = ["rt", "macros", "process", "time", "sync", "net", "fs", "io-util"] }
unicode-segmentation = "1"
unicode-width = "0.2.2"

[profile.release]
panic = "abort"

[profile.dev]
panic = "abort"

[dev-dependencies]
tempfile = "3.27.0"
vt100 = "0.18.1"
